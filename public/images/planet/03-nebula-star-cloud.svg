<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <filter id="nebula" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .012" numOctaves="5" seed="23" result="noise"/>
      <feColorMatrix in="noise" values="0 0 0 0 0.12  0 0 0 0 0.55  0 0 0 0 1  0 0 0 .72 0" result="blueNoise"/>
      <feComposite in="blueNoise" in2="SourceGraphic" operator="in" result="maskedNoise"/>
      <feGaussianBlur in="maskedNoise" stdDeviation="13" result="cloud"/>
      <feBlend in="cloud" in2="SourceGraphic" mode="screen"/>
    </filter>
    <radialGradient id="fade"><stop stop-color="#38BDF8" stop-opacity=".58"/><stop offset=".48" stop-color="#2563EB" stop-opacity=".25"/><stop offset="1" stop-color="#0B1B52" stop-opacity="0"/></radialGradient>
    <filter id="starGlow" x="-800%" y="-800%" width="1700%" height="1700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="stars" width="173" height="139" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="25" r="1" fill="#E7FAFF" opacity=".8"/><circle cx="79" cy="17" r=".7" fill="#7DD3FC"/><circle cx="144" cy="59" r="1.2" fill="#fff" opacity=".75"/>
      <circle cx="43" cy="108" r=".6" fill="#BAE6FD"/><circle cx="119" cy="121" r=".85" fill="#fff" opacity=".6"/><circle cx="165" cy="101" r=".5" fill="#38BDF8"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#stars)" opacity=".78"/>
  <ellipse cx="238" cy="497" rx="330" ry="640" fill="url(#fade)" filter="url(#nebula)" opacity=".85"/>
  <ellipse cx="1708" cy="356" rx="330" ry="610" fill="url(#fade)" filter="url(#nebula)" opacity=".9"/>
  <ellipse cx="1518" cy="80" rx="340" ry="255" fill="url(#fade)" filter="url(#nebula)" opacity=".55"/>
  <g fill="#F2FDFF" filter="url(#starGlow)">
    <circle cx="332" cy="301" r="3"/><circle cx="653" cy="136" r="2.5"/><circle cx="1440" cy="470" r="2.6"/><circle cx="1660" cy="298" r="2.3"/><circle cx="117" cy="616" r="2"/>
  </g>
  <g stroke="#E7FAFF" stroke-linecap="round" opacity=".9" filter="url(#starGlow)">
    <path d="M332 281V321M312 301H352"/><path d="M653 121V151M638 136H668"/>
    <path d="M1440 453V487M1423 470H1457"/><path d="M1660 285V311M1647 298H1673"/>
  </g>
</svg>
